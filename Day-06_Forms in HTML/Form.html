<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms Html</title>
  </head>
  <body>
    <section>
      <form action=""></form>
      <fieldset>
        <legend><h1>Employee Details</h1></legend>
        <label for="f-Name">First Name:</label>
        <input id="f-Name" type="text" />
        <br />
        <br />
        <label for="L-Name">Last Name:</label>
        <input id="L-Name" type="text" />
        <br />
        <br />

        <input type="radio" name="age" id="" />
        <label for="Male">Male</label>

        <input type="radio" name="age" id="" />
        <label for="female">Female</label>
        <br />
        <br />

        <label for="Employee Id"> Employee Id:</label>
        <input type="text" id="Employee Id" />
        <br />
        <br />

        <label for="Designation"> Designation:</label>
        <input type="text" name="Designation" id="Designation" />

        <br />
        <br />

        <label for="Number">Phone Number:</label>
        <input type="text" name="Number" id="Number" />
        <br />
        <br />
        <button type="submit">Submit</button>
      </fieldset>
    </section>

    <section>
      <form action="">
        <fieldset>
          <legend><h1>Novel Services Login</h1></legend>
          <label for="Username">Username:</label>
          <input type="text" name="Username" id="Username" />
          <br />
          <br />
          <label for="Password">Password:</label>
          <input type="text" name="Password" id="Password" />

          <br />
          <br />
          <label for="Employment">City of Employment:</label>
          <input type="text" name="Employment" id="Employment" />
          <br />
          <br />
          <label for="Server">Web Server:</label>
          <select name="select" id="select">
            <option value="India">India</option>
            <option value="NewYork">NewYork</option>
            <option value="Mumbai">Mumbai</option>
          </select>
          <br />
          <br />

          <label for="Role">Please Specify <br />your role:</label>
          <br />

          <input type="radio" name="Admin" id="Admin" />
          <label for="Admin">Admin</label>
          <br />
          <input type="radio" name="Engineer" id="Engineer" />
          <label for="Engineer">Engineer</label>
          <br />
          <input type="radio" name="Manager" id="Manager" />
          <label for="Manager">Manager</label>
          <br />
          <input type="radio" name="guest" id="guest" />
          <label for="guest">Guest</label>

          <br />
          <br />
          <label for="Single Sign in">Single Sign-on to the Following:</label>
          <br />
          <input type="radio" name="mail" id="mail" />
          <label for="mail">Mail</label>
          <br />
          <input type="radio" name="Payroll" id="Payroll" />
          <label for="Payroll">Payroll</label>
          <br />
          <input type="radio" name="Self-service" id="Self-service" />
          <label for="Self-service">Self-Service</label>

          <br />
          <br />
          <button type="login">Login</button>
          <button type="Reset">Reset</button>
        </fieldset>
      </form>
    </section>

    <section>
      <h1>Pete's pizza Delivery</h1>
      <h2>Online Order Form</h2>
      <p>* required fields</p>
      <fieldset>
        <legend>Customer Details</legend>
        <label for="Name">*Name:</label>
        <input type="text" name="Name" id="Name" />
        <br />
        <br />
        <label for="Address">*Address:</label>
        <input type="text" name="Address" id="Address" />
        <br />
        <br />
        <label for="Town/city"> *Town/city:</label>
        <input type="text" name="Town/City" id="Town/city" />
        <br />
        <br />
        <label for="postcode">*Postcode:</label>
        <input type="number" name="postcode" id="postcode" />
        <br />
        <br />
        <label for="Tel"> *Tel:</label>
        <input type="number" name="Tel" id="Tel" />
        <br />
        <br />
        <label for="Email">*Email:</label>
        <input type="email" />

        <br />
        <br />
        <br />

        <fieldset>
          <legend>Topping *</legend>
          <input type="radio" name="margherita" id="margherita" />
          <label for="margherita">Margherita</label>
          <br />
          <input type="radio" name="Four Seasons" id="Four Seasons" />
          <label for="Four Seasons">Four Seasons</label>
          <br />
          <input type="radio" name="Meat Feast" />
          <label for="Meat Feast">Meat Feast</label>
        </fieldset>

        <fieldset>
          <legend>Size *</legend>
          <input type="radio" name="Small" id="Small" />
          <label for="Small">Small</label>
          <br />
          <input type="radio" name="Medium" id="Medium" />
          <label for="Medium">Medium</label>
          <br />
          <input type="radio" name="Large" id="large" />
          <label for="large"> Large</label>
        </fieldset>

        <fieldset>
          <legend>Extras *</legend>
          <input type="radio" name="Mushrooms" id="Mushrooms" />
          <label for="Mushrooms">Mushrooms</label>
          <br />
          <input type="radio" name="Green-peppers" id="Green-peppers" />
          <label for="Green-peppers">Green peppers</label>
          <br />
          <input type="radio" name="Anchovies" id="Anchovies" />
          <label for="Anchovies">Anchovies</label>
          <br />
          <input type="radio" name="Extras" id="Extras" />
          <label for="Extras">Extra Cheese</label>
        </fieldset>

        <fieldset>
          <legend>Delivery</legend>
          <label for="Delivery TIme">Preferred delivery time: </label>
          <input type="time" name="time" id="Time" />
          <br />
          <br />
          <label for="Delivery ">Delivery Instructions:</label>
          <textarea name="area" id="textarea"></textarea>
        </fieldset>
        <button type="submit">Submit Order</button>
      </fieldset>
    </section>
  </body>
</html>
