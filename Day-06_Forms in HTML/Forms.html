<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms In Html</title>
  </head>
  <body>
    <div>
      <fieldset>
        <legend><h1>Forms</h1></legend>
        <form target="_blank" action="https://chandansari.in/">
          <label for="Name">Full Name</label>
          <input id="Name" placeholder="enter your name" type="Text" required />

          <br /><br />
          <label for="Email">Email :</label>
          <input id="Email" placeholder="enter your email" type="email" />

          <br /><br />
          <label for="Password">Password</label>
          <input
            id="Password"
            placeholder="enter your password"
            type="password"
          />

          <br /><br />

          <label for="checkbox">Are you 18+ ?</label>
          <input id="checkbox" type="checkbox" />

          <br /><br />

          <label for="number">Number</label>
          <input id="number" placeholder="enter your number" type="number" />

          <br /><br />

          <label for="gender">Gender : </label>
          <label for="gender">Male </label>
          <input id="gender" type="radio" name="gender" />
          <label for="gender">female </label>
          <input id="gender" type="radio" name="gender" />

          <br /><br />
          <label for="date">Enter Your DOB : </label>
          <input type="date" id="date" />

          <br /><br />
          <label for="date">Choose Your File : </label>
          <input type="file" id="file" />

          <br /><br />

          <button type="submit">Submit</button>

          <br /><br />
          <label for="city">Select your city</label>

          <select name="" id="city">
            <option value="delhi">Delhi</option>
            <option value="Haryana">Haryana</option>
            <option value="Mumbai">Mumbai</option>
            <option value="Gujraat">Gujraat</option>
            <option value="Karnataka">Karnataka</option>
          </select>
        </form>
      </fieldset>
    </div>
  </body>
</html>
