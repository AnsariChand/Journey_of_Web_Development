<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semantic Tag</title>
  </head>
  <body>
    <header>Header</header>

    <main>
      <section>
        <img
          src="https://picsum.photos/400/400"
          alt="Lorem Picsum"
          width="360px"
          height="400px"
        />
      </section>

      <section>
        <figure>
          <img
            src="https://picsum.photos/200"
            alt="Lorem Picsum"
            width="340px"
            height="400px"
          />
          <figcaption>Lorem image</figcaption>
        </figure>
      </section>

      <section>
        <video
          src="Dice.mp4"
          width="400px"
          height="300px"
          controls
          muted
          loop
          autoplay
        ></video>
      </section>

      <section>
        <video
          src="Rolling dice.mp4"
          width="400px"
          height="300px"
          controls
        ></video>
      </section>

      <section>
        <audio src="audio.mp3" controls></audio>
      </section>

      <section>
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m24!1m12!1m3!1d6999.88877980504!2d76.92093721461741!3d28.691310063346712!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!4m9!3e6!4m3!3m2!1d28.7116208!2d76.9304274!4m3!3m2!1d28.6873346!2d76.9255034!5e0!3m2!1sen!2sin!4v1788269963401!5m2!1sen!2sin"
          width="600"
          height="450"
          style="border: 0"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
      </section>

      <section>
        <h1>Html Entities</h1>
        <p>&lt;p&gt; for lower than sign and greater than sign</p>

        <p> &copy; 2007-2026 ansari.com</p>
      </section>
    </main>

    <footer>footer</footer>
  </body>
</html>
